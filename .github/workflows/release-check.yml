name: Verify release archive
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-package:
    uses: abhi1693/actions/.github/workflows/npm-release.yml@4a3bb4b7e193f842d2457bd7fe2cb32e1931974a
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      operation: check
      package-name: '@abhi1693/medusa-rbac'
      package-check-script: scripts/check-package.mjs
