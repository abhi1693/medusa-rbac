name: Verify release archive
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-package:
    uses: abhi1693/actions/.github/workflows/npm-release.yml@011f279b83e64db26d97218367dab81cceba29ea
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      operation: check
      package-name: '@abhi1693/medusa-rbac'
      package-check-script: scripts/check-package.mjs
