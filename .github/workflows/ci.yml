name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: abhi1693/actions/.github/workflows/node-ci.yml@v1
    with:
      node-version: "24"
      checks: '["lint", "typecheck", "test", "build"]'
      scripts: '{"lint":"format:check","typecheck":"typecheck","test":"ci:test","build":"ci:build"}'
      postgres-image: postgres:17-alpine
      postgres-database: postgres
      database-env-name: RBAC_TEST_DATABASE_URL
      database-url-scheme: postgres
      project-env: '{"MEDUSA_DISABLE_TELEMETRY":"true"}'
      test-results-path: coverage/
      test-results-name: rbac-coverage
      timeout-minutes: 30
  security:
    uses: abhi1693/actions/.github/workflows/security.yml@v1
    with:
      npm-audit: true
      npm-include-dev: true
      npm-severity: high
