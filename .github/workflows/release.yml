name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to prepare as a draft GitHub release.
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    uses: abhi1693/actions/.github/workflows/npm-release.yml@7283394d6444ce31b9844adbb7ebc0c7992c3eb4
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      operation: prepare
      package-name: '@abhi1693/medusa-rbac'
      version: ${{ inputs.version }}
      package-check-preset: medusa-access-client
