name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to prepare as a draft GitHub release.
        type: string
        required: true
        default: "0.0.1"

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  package:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and verify release package
        id: package
        env:
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/rbac-release
        run: npm run release:package
      - name: Attest package provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.package-path }}
      - name: Prepare draft release
        env:
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          PACKAGE_PATH: ${{ steps.package.outputs.package-path }}
          CHECKSUMS_PATH: ${{ steps.package.outputs.checksums-path }}
          PROVENANCE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/rbac-release
        run: |
          set -euo pipefail
          notes="docs/releases/$RELEASE_VERSION.md"
          test -f "$notes"
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" > "$RUNNER_TEMP/rbac-release-tags.txt"
          node --input-type=module -e '
            import fs from "node:fs"
            const refs = new Map(fs.readFileSync(process.env.RUNNER_TEMP + "/rbac-release-tags.txt", "utf8").trim().split("\n").filter(Boolean).map(line => line.split(/\s+/).reverse()))
            const ref = "refs/tags/" + process.env.RELEASE_TAG
            const target = refs.get(ref + "^{}") || refs.get(ref)
            if (target && target !== process.env.GITHUB_SHA)
              throw new Error("Existing release tag targets another commit")
          '
          gh release list --limit 1000 --json tagName > "$RUNNER_TEMP/rbac-releases.json"
          existing=$(node --input-type=module -e '
            import fs from "node:fs"
            const releases = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/rbac-releases.json", "utf8"))
            process.stdout.write(String(releases.some(release => release.tagName === process.env.RELEASE_TAG)))
          ')
          cp "$PROVENANCE_PATH" "$RELEASE_OUTPUT_DIR/provenance.json"
          if [ "$existing" = true ]; then
            gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/rbac-existing-release.json"
            node --input-type=module -e '
              import fs from "node:fs"
              const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/rbac-existing-release.json", "utf8"))
              if (!release.isDraft || release.targetCommitish !== process.env.GITHUB_SHA)
                throw new Error("Refusing to replace a published release or a draft for another commit")
            '
            gh release upload "$RELEASE_TAG" "$PACKAGE_PATH" "$CHECKSUMS_PATH" "$RELEASE_OUTPUT_DIR/provenance.json" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_PATH" "$CHECKSUMS_PATH" "$RELEASE_OUTPUT_DIR/provenance.json" \
              --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file "$notes"
          fi
