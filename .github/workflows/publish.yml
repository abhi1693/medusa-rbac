name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag. Run this workflow from that same tag.
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    uses: abhi1693/actions/.github/workflows/npm-release.yml@7283394d6444ce31b9844adbb7ebc0c7992c3eb4
    permissions:
      contents: read
      attestations: read
      id-token: write
    with:
      operation: publish
      package-name: '@abhi1693/medusa-rbac'
      tag: ${{ github.event.release.tag_name || inputs.tag }}
