name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag. Run recovery from master.
        type: string
        required: true
      preparation_revision:
        description: Preparation workflow commit for existing assets; leave blank for current revision.
        type: string
        required: false
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    uses: abhi1693/actions/.github/workflows/npm-publish.yml@f50dc9e516019437e94a5c85627db2ab5db1ff59
    permissions:
      contents: read
      attestations: read
      id-token: write
    with:
      preparation-revision: ${{ inputs.preparation_revision || 'f50dc9e516019437e94a5c85627db2ab5db1ff59' }}
      package-name: '@abhi1693/medusa-rbac'
      tag: ${{ github.event.release.tag_name || inputs.tag }}
